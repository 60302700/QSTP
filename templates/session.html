<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Review Shortlist</title>
<script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .candidate { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0; border-bottom: 1px solid #eee; }
  .candidate input { width: 1.1rem; height: 1.1rem; }
  #status { margin: 1rem 0; color: #555; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
</style>
</head>
<body>
<h1>Shortlist for <span id="startup-name">...</span></h1>
<div id="status"></div>
<div id="candidate-list">Loading…</div>
<button id="submit-btn">Send Invites to Selected</button>

<script id="candidate-template" type="text/x-handlebars-template">
{{#each candidates}}
<label class="candidate">
  <input type="checkbox" class="cand-checkbox" data-id="{{this._id}}" {{#if this.selected}}checked{{/if}}>
  <span>{{this.name}} — {{this.email}}</span>
</label>
{{else}}
<p>No candidates in this session.</p>
{{/each}}
</script>

<script>
const token = window.location.pathname.split('/').filter(Boolean)[1];
const template = Handlebars.compile(document.getElementById('candidate-template').innerHTML);
const statusEl = document.getElementById('status');
const submitBtn = document.getElementById('submit-btn');

async function loadSession() {
  const res = await fetch(`/session/${token}`);
  const session = await res.json();
  if (!res.ok) {
    statusEl.textContent = session.detail || 'Session not found.';
    document.getElementById('candidate-list').innerHTML = '';
    submitBtn.disabled = true;
    return;
  }

  document.getElementById('startup-name').textContent = session.startup;
  const selectedSet = new Set(session.selected_ids);
  const candidates = session.candidates.map(c => ({ ...c, selected: selectedSet.has(c._id) }));
  document.getElementById('candidate-list').innerHTML = template({ candidates });

  document.querySelectorAll('.cand-checkbox').forEach(cb => {
    cb.addEventListener('change', async (e) => {
      const id = e.target.dataset.id;
      const action = e.target.checked ? 'select' : 'deselect';
      const r = await fetch(`/session/${token}/${action}/${id}`, { method: 'POST' });
      if (!r.ok) {
        const err = await r.json();
        statusEl.textContent = err.detail || 'Could not update selection.';
        e.target.checked = !e.target.checked;
      }
    });
  });

  if (session.status !== 'open') {
    submitBtn.disabled = true;
    statusEl.textContent = 'This session has already been submitted.';
  }
}

submitBtn.addEventListener('click', async () => {
  submitBtn.disabled = true;
  const res = await fetch(`/session/${token}/submit`, { method: 'POST' });
  const data = await res.json();
  if (res.ok) {
    statusEl.textContent = `Invites sent to ${data.verification_tokens.length} candidate(s).`;
  } else {
    statusEl.textContent = data.detail || 'Something went wrong.';
    submitBtn.disabled = false;
  }
});

loadSession();
</script>
</body>
</html>
