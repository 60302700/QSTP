<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Confirm Your Interest</title>
<script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  fieldset { border: 1px solid #ddd; border-radius: 6px; margin-bottom: 1rem; padding: 0.8rem 1rem; }
  legend { font-weight: 600; }
  label { display: block; margin: 0.3rem 0; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  #result { margin-top: 1rem; font-size: 1.05rem; }
</style>
</head>
<body>
<h1>Confirm Your Interest</h1>
<form id="verify-form">
  <fieldset>
    <legend>1. Are you already employed at another job?</legend>
    <label><input type="radio" name="already_employed" value="yes" required> Yes</label>
    <label><input type="radio" name="already_employed" value="no"> No</label>
  </fieldset>
  <fieldset>
    <legend>2. Are you down for the position?</legend>
    <label><input type="radio" name="down_for_position" value="yes" required> Yes</label>
    <label><input type="radio" name="down_for_position" value="no"> No</label>
  </fieldset>
  <button type="submit">Submit</button>
</form>
<div id="result"></div>

<script id="result-template" type="text/x-handlebars-template">
{{#if_eq result "disabled"}}
  <p>Thanks for letting us know — since you're already employed, we won't reach out again for the next 3 months.</p>
{{/if_eq}}
{{#if_eq result "accepted"}}
  <p>Great — you're now a candidate! We'll be in touch about next steps.</p>
{{/if_eq}}
{{#if_eq result "declined"}}
  <p>Thanks for letting us know. We've marked you as not interested.</p>
{{/if_eq}}
</script>

<script>
Handlebars.registerHelper('if_eq', function (a, b, opts) {
  return a === b ? opts.fn(this) : opts.inverse(this);
});

const token = window.location.pathname.split('/').filter(Boolean)[1];
const resultTemplate = Handlebars.compile(document.getElementById('result-template').innerHTML);
const form = document.getElementById('verify-form');
const resultEl = document.getElementById('result');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const body = {
    already_employed: fd.get('already_employed') === 'yes',
    down_for_position: fd.get('down_for_position') === 'yes',
  };

  const res = await fetch(`/verify/${token}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();

  if (res.ok) {
    resultEl.innerHTML = resultTemplate(data);
    form.style.display = 'none';
  } else {
    resultEl.textContent = data.detail || 'Something went wrong.';
  }
});
</script>
</body>
</html>
