version: "3.9"

services:
  # ── FastAPI application ────────────────────────────────────────────────────
  app:
    build: .
    container_name: qstp-api
    ports:
      - "8000:8000"
    env_file:
      - .env # loads MONGODB_URI, RESEND_API_KEY, etc.
    environment:
      - BASE_URL=http://localhost:8000
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: qstp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
