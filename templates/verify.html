<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm Your Interest</title>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #172033;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #2563eb;
        --accent-soft: #eff6ff;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 2rem 1rem 3rem;
        background: linear-gradient(135deg, #f8fbff 0%, var(--bg) 100%);
        color: var(--text);
      }
      .card {
        max-width: 560px;
        margin: 0 auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 1.4rem;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.4rem;
      }
      .subtitle {
        color: var(--muted);
        margin-bottom: 1rem;
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: 14px;
        margin-bottom: 1rem;
        padding: 0.9rem 1rem;
        background: #fcfdff;
      }
      legend {
        font-weight: 700;
        color: var(--text);
      }
      label {
        display: block;
        margin: 0.45rem 0;
        color: var(--muted);
      }
      button {
        padding: 0.75rem 1.1rem;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        border-radius: 999px;
        background: linear-gradient(120deg, var(--accent) 0%, #3b82f6 100%);
        color: white;
        box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
      }
      #result {
        margin-top: 1rem;
        font-size: 1rem;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Confirm Your Interest</h1>
      <div class="subtitle">
        Please answer the two questions below so we can update your application.
      </div>
      <form id="verify-form">
        <fieldset>
          <legend>1. Are you already employed at another job?</legend>
          <label
            ><input type="radio" name="already_employed" value="yes" required />
            Yes</label
          >
          <label
            ><input type="radio" name="already_employed" value="no" /> No</label
          >
        </fieldset>
        <fieldset>
          <legend>2. Are you down for the position?</legend>
          <label
            ><input
              type="radio"
              name="down_for_position"
              value="yes"
              required
            />
            Yes</label
          >
          <label
            ><input type="radio" name="down_for_position" value="no" />
            No</label
          >
        </fieldset>
        <button type="submit">Submit</button>
      </form>
      <div id="result"></div>
    </div>

    <script id="result-template" type="text/x-handlebars-template">
      {{#if_eq result "disabled"}}
        <p>Thanks for letting us know — since you're already employed, we won't
          reach out again for the next 3 months.</p>
      {{/if_eq}}
      {{#if_eq result "accepted"}}
        <p>Great — you're now a candidate! We'll be in touch about next steps.</p>
      {{/if_eq}}
      {{#if_eq result "declined"}}
        <p>Thanks for letting us know. We've marked you as not interested.</p>
      {{/if_eq}}
    </script>

    <script>
      Handlebars.registerHelper("if_eq", function (a, b, opts) {
        return a === b ? opts.fn(this) : opts.inverse(this);
      });

      const token = window.location.pathname.split("/").filter(Boolean)[1];
      const resultTemplate = Handlebars.compile(
        document.getElementById("result-template").innerHTML,
      );
      const form = document.getElementById("verify-form");
      const resultEl = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const body = {
          already_employed: fd.get("already_employed") === "yes",
          down_for_position: fd.get("down_for_position") === "yes",
        };

        const res = await fetch(`/verify/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (res.ok) {
          resultEl.innerHTML = resultTemplate(data);
          form.style.display = "none";
        } else {
          resultEl.textContent = data.detail || "Something went wrong.";
        }
      });
    </script>
  </body>
</html>
